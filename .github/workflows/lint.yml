name: Lint & Test

on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches:
      - main
    paths:
      - "lncrawl/**"
      - "sources/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lncrawl/**"
      - "sources/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # BearReader ships as a PyInstaller EXE with 3.11 embedded; only the
        # requires-python floor (3.9) and the actual runtime (3.11) are tested.
        python-version: ["3.9", "3.11"]
    name: Python ${{ matrix.python-version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Install uv & Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: 📦 Install Dependencies
        run: uv sync --frozen --all-extras --all-groups

      - name: 🧹 Lint Code
        run: |
          uv run pyright lncrawl
          uv run ruff format --diff --check
          uv run ruff check
          git diff --name-only -- "*.py" | xargs -r pyright

      - name: 🏗️ Build Wheel
        run: uv run python -m build --wheel --no-isolation

      - name: 🧪 Test Installation
        run: pip install dist/xiaoxiong_novel-*.whl

      - name: 🧪 Check lncrawl
        run: xiaoxiong-novel -ll sources list

      - name: Detect Database Drift
        run: xiaoxiong-novel -ll dev migrate verify
