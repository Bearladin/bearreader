name: Validate embedded web build

on:
  push:
    paths:
      - "frontend/**"
      - "lncrawl/server/web/**"
      - "frontend-manifest.json"
      - "scripts/sync_localized_frontend.py"
      - "scripts/frontend_manifest.py"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "lncrawl/server/web/**"
      - "frontend-manifest.json"
      - "scripts/sync_localized_frontend.py"
      - "scripts/frontend_manifest.py"
      - ".github/workflows/web.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-embedded-web:
    # The embedded output is built on Windows locally and in release.yml; the
    # workbox-generated sw.js is platform-sensitive, so the rebuild-and-compare
    # gate must run on the same platform to be meaningful.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild frontend and compare against the embedded copy
        shell: pwsh
        run: |
          function Invoke-Native {
            param(
              [Parameter(Mandatory = $true, Position = 0)][string] $FilePath,
              [Parameter(Position = 1, ValueFromRemainingArguments = $true)][string[]] $ArgumentList
            )
            $output = & $FilePath @ArgumentList
            if ($LASTEXITCODE -ne 0) {
              throw "Native command failed ($LASTEXITCODE): $FilePath $($ArgumentList -join ' ')"
            }
            $output
          }
          Push-Location frontend
          Invoke-Native yarn install --frozen-lockfile
          Invoke-Native yarn audit:zh
          Invoke-Native yarn lint
          Invoke-Native yarn build
          Pop-Location
          Invoke-Native python scripts\sync_localized_frontend.py --compare
          Invoke-Native python scripts\sync_localized_frontend.py --validate-only

      - name: Upload built dist for diagnosis
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-built-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7
